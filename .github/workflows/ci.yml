name: CI

on:
  pull_request:
    branches: [develop, main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - 'LICENSE'
  push:
    branches: [develop]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - 'LICENSE'

permissions:
  contents: read
  pull-requests: write

jobs:
  # 무엇이 바뀌었는지 한 번만 검사해서 후속 step의 조건으로 사용한다
  changes:
    # 릴리즈/싱크 PR(develop -> main)은 건너뛴다 - `push: [develop]` 이 이미 같은 트리를 돌렸다.
    # main 은 develop 의 과거 상태(직전 릴리즈 시점)라 develop 을 main 에 머지한 결과의 트리는
    # develop tip 과 동일하다. 그래서 develop 에 푸시할 때의 push 실행과 열린 릴리즈 PR 의
    # pull_request(synchronize) 실행이 같은 SHA·같은 트리를 두 번 검사하게 된다.
    # 이 조건은 head 가 develop 인 경우만 빼므로, 긴급 hotfix 브랜치 -> main PR 은 그대로 돈다.
    # `test` 는 `needs: changes` 라 이 job 이 skip 되면 함께 skip 된다.
    if: >-
      !(github.event_name == 'pull_request' &&
        github.event.pull_request.head.ref == 'develop' &&
        github.event.pull_request.base.ref == 'main')
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      stories: ${{ steps.filter.outputs.stories }}
      deps: ${{ steps.filter.outputs.deps }}
      vanilla: ${{ steps.filter.outputs.vanilla }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - 'src/ui/**'
              - 'src/styles/**'
              - 'src/utils/**'
              - 'src/index.ts'
              - 'src/test/**'
              - 'tsup.config.ts'
              - 'vitest.config.ts'
              - 'tsconfig.json'
              - 'biome.json'
              - 'scripts/**'
            stories:
              - 'src/**/*.stories.tsx'
              - 'src/stories/**'
              - '.storybook/**'
            deps:
              - 'package.json'
              - 'pnpm-lock.yaml'
            vanilla:
              - 'src/vanilla/**'

  test:
    needs: changes
    # docs-only / config-only PR은 paths-ignore에서 이미 걸러짐.
    # 그 외엔 code / stories / deps / vanilla 중 하나라도 변경된 경우만 돈다.
    if: |
      needs.changes.outputs.code == 'true' ||
      needs.changes.outputs.stories == 'true' ||
      needs.changes.outputs.deps == 'true' ||
      needs.changes.outputs.vanilla == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.14.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint commit messages
        if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]' && github.base_ref == 'develop'
        run: pnpm exec commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

      # SCSS lint — raw hex / named color / raw 값 금지 (DS 토큰 강제)
      #
      # 조건을 두지 않는다. 이전 조건(`code || stories`)은 `code` 필터에 src/vanilla/** 가
      # 없어서 vanilla 만 바뀐 PR 에서 스킵됐고, `deps` 만 바뀐 PR 도 스킵됐다 - 그런데
      # package.json 이 lint:css 의 글롭 자체를 담고 있다. 조건을 열거하면 이런 구멍이 계속
      # 생기고, 이 job 이 도는 모든 경우(code/stories/deps/vanilla)에 SCSS 를 봐서 손해가 없다.
      # Build · size · dist 검사들과 같은 방식이다.
      - name: Lint SCSS (Stylelint)
        run: pnpm lint:css

      # 코드 또는 의존성 변경 → unit 테스트 + 커버리지
      - name: Run tests with coverage
        if: needs.changes.outputs.code == 'true' || needs.changes.outputs.deps == 'true'
        run: pnpm test:coverage

      # Storybook a11y는 무겁다 (Playwright + Chromium 다운로드 ~200MB)
      # 컴포넌트 / 스토리 / 토큰이 바뀐 경우만 돈다
      - name: Install Playwright browsers
        if: needs.changes.outputs.code == 'true' || needs.changes.outputs.stories == 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Run a11y tests (Storybook)
        if: needs.changes.outputs.code == 'true' || needs.changes.outputs.stories == 'true'
        run: pnpm test:storybook

      # 빌드는 모든 변경에서 검증 (deps/scripts 변경도 빌드 영향 가능)
      - name: Build
        run: pnpm build

      # size-limit은 dist 산출물 기반 — 빌드 직후 항상
      - name: Check bundle size
        run: pnpm size

      # 아래 두 검사도 dist 산출물을 읽는다 — 반드시 Build 이후여야 한다.
      # 단위 테스트로는 잡을 수 없는 종류다: jsdom 은 스타일시트를 계산하지 않고,
      # 문서와 빌드 산출물의 어긋남은 어떤 테스트도 보지 않는다.
      - name: Check documented CSS variables
        run: pnpm check:css-vars

      - name: Check Prose heading weights
        run: pnpm check:prose

      - name: Coverage Report
        uses: davelosert/vitest-coverage-report-action@v2
        if: github.event_name == 'pull_request' && (needs.changes.outputs.code == 'true' || needs.changes.outputs.deps == 'true')
        with:
          json-summary-path: ./coverage/coverage-summary.json
          json-final-path: ./coverage/coverage-final.json
