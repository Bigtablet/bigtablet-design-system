name: Release

on:
  push:
    tags:
      - 'v*'

# 기본은 읽기만 (시큐어코딩 가이드 W-2-3-2). 쓰기 권한은 아래 job 에서 상향한다.
permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: pnpm

      - name: Pin npm to 11.x (OIDC Trusted Publisher; npm@12 ships broken sigstore)
        run: npm install -g npm@11

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Publish to npm
        run: npm publish --provenance --access public

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          VERSION=${TAG#v}
          # CHANGELOG.md 의 해당 버전 주요 업데이트 를 릴리즈 노트로 사용 (조직 공통 양식 SSOT, 한글).
          # --generate-notes 자동 PR 목록은 양식에 안 맞아 사용하지 않는다.
          NOTES=$(awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { f=1; next }
            f && /^## \[/ { exit }
            f { print }
          ' CHANGELOG.md)
          [ -z "$(printf '%s' "$NOTES" | tr -d '[:space:]')" ] && NOTES="- 자세한 변경은 CHANGELOG.md 참고"
          BODY=$(printf '## Design System of Bigtablet, Inc.\n#### 주요 업데이트\n%s' "$NOTES")
          gh release create "$TAG" --title "$TAG" --notes "$BODY"
