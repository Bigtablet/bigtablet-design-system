name: Dependency Submission (npm + pnpm)

on:
  push:
    branches: [ main ]
    paths:
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/dependency-submission-npm-pnpm.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/dependency-submission-npm-pnpm.yml'
  schedule:
    - cron: '0 23 * * *'
  workflow_dispatch:

# 기본은 읽기만 (시큐어코딩 가이드 W-2-3-2). 쓰기 권한은 아래 job 에서 상향한다.
permissions:
  contents: read

jobs:
  submit-deps:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'

      - name: Generate and submit dependency graph (npm + pnpm)
        uses: advanced-security/component-detection-dependency-submission-action@b282c67b1008fde9b60da4bdfcd8849613e293b2 # v0.1.6
        with:
          detectorsFilter: Npm,Pnpm