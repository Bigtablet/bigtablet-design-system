# 공급망 방어 (시큐어코딩 가이드 W-2-15-3) - 배포 24시간(1440분) 미만 버전은 받지 않는다.
# 탈취 계정·typosquat 으로 올라온 악성 버전은 대부분 하루 안에 내려간다. `--frozen-lockfile` 설치도
# lockfile 항목을 이 기준으로 검사하므로 CI 에서도 걸린다.
# 당일 보안 패치를 받아야 하면 그 패키지만 `minimumReleaseAgeExclude: [<name>]` 에 넣고 사유를 적는다.
minimumReleaseAge: 1440

# pnpm 10 이후 `pnpm.overrides` 는 package.json 이 아닌 이 파일에서 읽힘.
# (pnpm 10.20: "The pnpm field in package.json is no longer read" 경고 → 여기로 이전)
# 전부 dev/build 전용 transitive 의존성 - 배포 패키지(dependencies: @react-spring/web) 에는 영향 없음.
overrides:
  # 보안 패치 (Dependabot open alert 대응 - first_patched_version 기준)
  immutable: ^5.1.9 # was 5.1.5 - hash-collision DoS + List 32bit overflow (GHSA #83/#84)
  js-yaml: ^4.3.2 # was 4.3.1 - empty merge source escapes maxTotalMergeKeys CPU limit (high #116)
  "@vitest/browser": ^4.1.10 # was 4.1.9 - provider commands bypass file-access gate (critical #86)
  fast-uri: ^3.1.8 # was 3.1.7 - 2026-09-30 audit moderate; 3.1.6 이전 SSRF 항목(high x4) 포함
  sharp: ^0.35.3 # was 0.34.5 - libvips CVE-2026-33327/33328/35590/35591 (#87)
  brace-expansion: ^5.0.12 # was 5.0.9 - 2026-09-30 `{a},b}` quadratic expansion (moderate/high). @storybook/react-vite 경유
  "nanoid@5": ^5.1.16 # was 5.1.11 - 2026-09-30 high. 5.x 에만 걸어 nanoid 3.x(다른 경유) 는 그대로 둔다
  # 기존 보안 오버라이드 유지 (트리에 실재)
  undici: ^7.29.1 # was 7.29.0 - 2026-09-30 TLS cert validation bypass(high) + cookie/retry/chunked 5건; 7.28 이전 항목(#102-106) 포함
  esbuild: ^0.28.1
  rollup: ^4.59.0
  postcss: ^8.5.23 # was 8.5.22 - sourceMappingURL arbitrary .map read when `from` unset (#100)
  minimatch: ^10.2.4
